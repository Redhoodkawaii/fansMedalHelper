name: Sync Fork (manual only)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repo-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Sync the immediate upstream after review
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh repo sync Redhoodkawaii/fansMedalHelper --source xiaofeiTM233/fansMedalHelper --branch master
