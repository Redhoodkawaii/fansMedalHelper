name: Daily Fans Medal Helper

on:
  workflow_dispatch:
  schedule:
    - cron: '37 11 * * *' # 19:37 Asia/Shanghai and Asia/Singapore

permissions:
  contents: read

concurrency:
  group: daily-fans-medal
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    env:
      TZ: Asia/Shanghai
    steps:
      - name: Check out reviewed repository code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Install pinned dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-actions.txt
      - name: Run once with private credentials
        env:
          BILI_ACCESS_KEY: ${{ secrets.BILI_ACCESS_KEY }}
        run: python run_actions.py
