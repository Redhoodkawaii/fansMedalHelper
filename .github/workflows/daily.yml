name: Daily Fans Medal Report

on:
  workflow_dispatch:
  schedule:
    - cron: '10 12 * * *' # 20:10 Asia/Shanghai and Asia/Singapore

permissions:
  contents: read

concurrency:
  group: daily-fans-medal
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TZ: Asia/Shanghai
    steps:
      - name: Check out reviewed repository code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Get reporting date
        id: day
        run: echo "value=$(date +%F)" >> "$GITHUB_OUTPUT"
      - name: Check for an existing daily report
        id: daily-cache
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4
        with:
          path: daily-reports
          key: medal-mock-v2-${{ steps.day.outputs.value }}
          lookup-only: true
      - name: Generate simulated daily report
        if: steps.daily-cache.outputs.cache-hit != 'true'
        env:
          REPORT_DATE: ${{ steps.day.outputs.value }}
        run: python run_actions.py --date "$REPORT_DATE"
      - name: Save daily completion
        if: steps.daily-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4
        with:
          path: daily-reports
          key: medal-mock-v2-${{ steps.day.outputs.value }}
      - name: Log duplicate run
        if: steps.daily-cache.outputs.cache-hit == 'true'
        run: echo "今日模拟报告已生成，跳过。"
